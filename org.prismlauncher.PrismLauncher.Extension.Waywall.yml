id: org.prismlauncher.PrismLauncher.Extension.Waywall
branch: stable

runtime: org.prismlauncher.PrismLauncher
runtime-version: stable
sdk: org.freedesktop.Sdk//25.08
sdk-extensions: []

build-extension: true
separate-locales: false

build-options:
  prefix: /app/extensions/Waywall

modules:
  - name: luajit
    buildsystem: simple
    build-commands:
      - make PREFIX=$FLATPAK_DEST install
    sources:
      - type: git
        url: https://github.com/LuaJIT/LuaJIT
        branch: v2.1
  - name: spng
    buildsystem: meson
    builddir: true
    config-opts:
      - --prefix=/app/extensions/Waywall
    sources:
      - type: git
        url: https://github.com/randy408/libspng.git
        tag: v0.7.4
  # https://www.linuxfromscratch.org/blfs/view/11.3-systemd/x/x7lib.html
  # FIXME: i think it bundled in sdk...
  - name: libfontenc
    buildsystem: autotools
    sources:
      - type: archive
        url: https://www.x.org/pub/individual/lib/libfontenc-1.1.7.tar.xz
        md5: 6d3f1b15bb5b0bb71ae9f0a5103c1fc4
  - name: libXfont2
    buildsystem: autotools
    build-options:
      env:
        PKG_CONFIG_PATH: /app/extensions/Waywall/lib/pkgconfig
    sources:
      - type: archive
        url: https://www.x.org/pub/individual/lib/libXfont2-2.0.6.tar.xz
        md5: c179daa707f5f432f1bc13977e5bb329
  # https://www.linuxfromscratch.org/blfs/view/11.3-systemd/x/x7font.html
  - name: fontutil
    buildsystem: autotools
    sources:
      - type: archive
        url: https://www.x.org/pub/individual/font/font-util-1.4.0.tar.xz
        md5: ec6cea7a46c96ed6be431dfbbb78f366
  # https://www.linuxfromscratch.org/blfs/view/11.3-systemd/x/libxcvt.html
  - name: libxcvt
    buildsystem: meson
    builddir: true
    build-options:
      env:
        PKG_CONFIG_PATH: /app/extensions/Waywall/lib/pkgconfig
    config-opts:
      - --prefix=/app/extensions/Waywall
    sources:
      - type: archive
        url: https://www.x.org/pub/individual/lib/libxcvt-0.1.3.tar.xz
        md5: 7fb9c51d33a680f724f34da41768b1d0
  # https://www.linuxfromscratch.org/blfs/view/12.4-systemd/x/xwayland.html
  - name: xwayland
    buildsystem: meson
    builddir: true
    build-options:
      env:
        PKG_CONFIG_PATH: /app/extensions/Waywall/lib/pkgconfig
    config-opts:
      - --prefix=/app/extensions/Waywall
      - -Dsecure-rpc=false
    sources:
      - type: archive
        url: https://www.x.org/pub/individual/xserver/xwayland-24.1.14.tar.xz
        sha256: 4eb6b98d678299a4b96138d886345b294130695760345ef84596225a8224078a
  - name: waywall
    buildsystem: meson
    builddir: true

    build-options:
      env:
        PATH: /app/bin:/usr/bin:/app/extensions/Waywall/bin
        PKG_CONFIG_PATH: /app/extensions/Waywall/lib/pkgconfig

    config-opts:
      - --prefix=/app/extensions/Waywall

    sources:
      - type: git
        url: https://github.com/tesselslate/waywall
        tag: 0.2026.10.12
      - type: patch
        path: Xwl-path.patch
      - type: patch
        path: wl_display_add_socket_auto.patch
